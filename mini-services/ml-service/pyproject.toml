requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "joblib>=1.4.0",
    "pydantic>=2.0.0",
    "flask>=3.1.3",
]

[tool.uv]
dev-dependencies = []
